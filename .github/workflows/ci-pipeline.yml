name: PipeLine
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Go unit tests
        run: go test ./tests/... -count=1

      - name: Build lab image (Geany) and run Docker Compose
        run: |
          docker compose down || true
          make lab-image
          LAB_IMAGE=edu-lab-lab-vnc:geany docker compose up -d --build

          