name: Deploy to Host

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          docker build -t edu-lab-vnc:latest ./lab-image
          docker-compose down
          docker-compose up -d --build

