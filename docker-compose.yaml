version: '3.8'

services:
  lab-platform:
    build: .
    container_name: virtual-lab
    user: root
    ports:
      - "9000:9000"              # API платформы
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Используем именованные volumes для данных (работает на всех платформах!)
      - lab-students:/app/students
      - lab-backups:/app/backups
      - lab-logs:/app/logs
      - ./web:/app/web
    environment:
      - TZ=Europe/Moscow
      - DOCKER_HOST=unix:///var/run/docker.sock
      - USE_DOCKER_VOLUMES=true  # Включаем режим volumes для Mac
      - PLATFORM=${PLATFORM:-auto}
      - SERVER_IP=192.168.31.117  # auto, mac, linux, windows
    # Добавляем группу docker для доступа к сокету
    group_add:
      - "999"  # стандартный GID группы docker
      - "1000" # запасной вариант
      
    privileged: true
    restart: unless-stopped

volumes:
  lab-students:
  lab-backups:
  lab-logs: